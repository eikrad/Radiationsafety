services:
  # One-shot: hands the index directory to the backend's uid 1000, so it works when
  # Docker created the directory (as root) or files were copied in as another user.
  # Only this short-lived container gets root and CHOWN; the backend stays unprivileged.
  chroma-permissions:
    image: busybox:1.37
    user: root
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - ${CHROMA_DIR:-./.chroma}:/data
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      chroma-permissions:
        condition: service_completed_successfully
    volumes:
      # The vector index on the host, shared with local runs (uv run python ingestion.py).
      # chroma-permissions makes it writable for the backend's uid 1000. CHROMA_DIR
      # (from .env or the shell) points it elsewhere, e.g. /srv/radiationsafety/chroma.
      - ${CHROMA_DIR:-./.chroma}:/app/.chroma
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    stop_grace_period: 10s
    restart: unless-stopped
