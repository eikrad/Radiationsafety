<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eval Run Dashboard</title>
<style>
/* Tokens: validated default data-viz palette (single series, status, blue
   sequential ramp). Dark values are their own steps, not an inversion. */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series: #2a78d6;
  --marker: #52514e;
  --good: #0ca30c;
  --good-text: #006300;
  --good-tint: #e4f3e2;
  --critical: #d03b3b;
  --critical-text: #b42f2f;
  --critical-tint: #fbe7e5;
  --warning: #fab219;
  --warning-tint: #fdf3dc;
  --seq-0: #cde2fb; --seq-1: #9ec5f4; --seq-2: #6da7ec;
  --seq-3: #3987e5; --seq-4: #256abf; --seq-5: #184f95;
  --seq-ink-0: #0b0b0b; --seq-ink-1: #0b0b0b; --seq-ink-2: #0b0b0b;
  --seq-ink-3: #0b0b0b; --seq-ink-4: #ffffff; --seq-ink-5: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #9c9a93;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series: #3987e5;
    --marker: #c3c2b7;
    --good-text: #0ca30c;
    --good-tint: #15291a;
    --critical-text: #e66767;
    --critical-tint: #341b1b;
    --warning-tint: #33290f;
    --seq-0: #0d366b; --seq-1: #104281; --seq-2: #184f95;
    --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec;
    --seq-ink-0: #ffffff; --seq-ink-1: #ffffff; --seq-ink-2: #ffffff;
    --seq-ink-3: #ffffff; --seq-ink-4: #0b0b0b; --seq-ink-5: #0b0b0b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #9c9a93;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --series: #3987e5;
  --marker: #c3c2b7;
  --good-text: #0ca30c;
  --good-tint: #15291a;
  --critical-text: #e66767;
  --critical-tint: #341b1b;
  --warning-tint: #33290f;
  --seq-0: #0d366b; --seq-1: #104281; --seq-2: #184f95;
  --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec;
  --seq-ink-0: #ffffff; --seq-ink-1: #ffffff; --seq-ink-2: #ffffff;
  --seq-ink-3: #ffffff; --seq-ink-4: #0b0b0b; --seq-ink-5: #0b0b0b;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 4px; }
h3 { font-size: 14px; margin: 16px 0 6px; }
p { margin: 0; }
.sub, .note { color: var(--ink-2); }
.note { font-size: 13px; margin-bottom: 12px; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

.filters {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  margin: 16px -16px 20px; padding: 10px 16px;
  background: var(--page);
  border-bottom: 1px solid var(--border);
}
label { color: var(--ink-2); font-size: 13px; max-width: 100%; }
#set-select { max-width: min(100%, calc(100vw - 32px)); }
select {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px;
  max-width: 100%;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
}

/* Headline */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 48px; font-weight: 600; line-height: 1.1; }
.tile .value.small { font-size: 18px; line-height: 1.4; }
.tile .deltas { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.delta { font-variant-numeric: tabular-nums; font-weight: 600; }
.delta.up { color: var(--good-text); }
.delta.down { color: var(--critical-text); }
.delta.flat { color: var(--ink-2); }

/* Trends: small multiples */
.multiples { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
/* Two lines for every title, so the plots of one row line up. */
.panel h3 { margin: 0 0 10px; font-weight: 600; line-height: 1.3; min-height: 2.6em; }
.panel .latest { color: var(--ink-2); font-weight: 400; }
.chart { display: flex; align-items: stretch; }
.y-gutter { position: relative; width: 36px; flex-shrink: 0; }
.y-gutter span {
  position: absolute; right: 6px; transform: translateY(-50%);
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.plot { position: relative; flex: 1; min-width: 0; outline: none; }
.plot:focus-visible { box-shadow: 0 0 0 2px var(--series); border-radius: 4px; }
.plot svg { display: block; width: 100%; overflow: visible; }
.x-axis {
  position: relative; height: 16px; margin-left: 36px; margin-top: 4px;
  font-size: 11px; color: var(--muted);
}
.x-axis span { position: absolute; white-space: nowrap; }
.x-axis .mid { transform: translateX(-50%); }
.x-axis .end { right: 0; }
.plot .badge {
  position: absolute; top: -8px; transform: translateX(-50%);
  min-width: 16px; padding: 0 4px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--marker); color: var(--ink-2);
  font-size: 10px; line-height: 14px; text-align: center; font-variant-numeric: tabular-nums;
}
.chart-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; margin: 0; }
.legend-markers { margin-top: 10px; font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.key-dash { display: inline-block; width: 14px; border-top: 1px dashed var(--muted); vertical-align: middle; margin-right: 6px; }
.key-ring { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--series); border-radius: 50%; vertical-align: -1px; margin-right: 6px; }

.tooltip {
  position: fixed; z-index: 20; pointer-events: none;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  padding: 8px 10px; font-size: 12px; min-width: 180px; max-width: 320px;
}
.tooltip[hidden] { display: none; }
.tooltip .t-head { color: var(--ink-2); margin-bottom: 4px; }
.tooltip .t-row { display: flex; align-items: center; gap: 8px; }
.tooltip .t-row strong { font-variant-numeric: tabular-nums; min-width: 40px; }
.tooltip .t-key { width: 12px; border-top: 2px solid var(--series); }

/* Tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; text-align: left; vertical-align: top; }
thead th { color: var(--ink-2); font-weight: 500; border-bottom: 1px solid var(--axis); white-space: nowrap; }
tbody tr + tr td, tbody tr + tr th { border-top: 1px solid var(--grid); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }

/* Question grid + topic table */
.matrix th.q { font-weight: 400; min-width: 220px; max-width: 360px; }
.matrix .qid { color: var(--muted); font-size: 11px; display: block; }
.matrix th.run { text-align: center; font-size: 11px; line-height: 1.3; min-width: 64px; }
.matrix th.run.selected { color: var(--ink); font-weight: 600; }
.matrix td.cell { padding: 2px; text-align: center; }
.cell-btn {
  width: 100%; min-width: 44px; min-height: 30px; border: 0; border-radius: 4px;
  font: 600 13px system-ui, sans-serif; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.cell-btn:focus-visible { outline: 2px solid var(--series); outline-offset: 1px; }
.cell-btn.pass { background: var(--good-tint); color: var(--good-text); }
.cell-btn.fail { background: var(--critical-tint); color: var(--critical-text); }
.cell-btn.missing { background: transparent; color: var(--muted); font-weight: 400; font-size: 11px; }
.cell-btn.unjudged { background: var(--warning-tint); color: var(--ink-2); }
.failures { list-style: none; padding: 0; margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.failures strong { color: var(--ink); font-variant-numeric: tabular-nums; display: inline-block; min-width: 1.5em; }
.cell-btn .n { display: block; font-weight: 400; font-size: 10px; opacity: 0.85; }
.cell-btn.low-n { opacity: 0.45; font-style: italic; }
.topic-tag {
  display: inline-block; font-size: 11px; color: var(--ink-2);
  border: 1px solid var(--axis); border-radius: 999px; padding: 0 6px; margin: 2px 4px 0 0;
}
.group-row th { color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 12px; }

/* Compare */
.verdict { font-size: 18px; font-weight: 600; margin: 4px 0 8px; }
.pair { color: var(--ink-2); font-size: 13px; }
.warnings { list-style: none; padding: 0; margin: 10px 0 0; }
.warnings li {
  background: var(--warning-tint); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px;
  font-size: 13px;
}
.warnings li::before { content: "⚠ "; }
.flip { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.flip .status { font-weight: 600; margin-right: 6px; }
.flip .status.fail, .flip .status.lower { color: var(--critical-text); }
.flip .status.pass, .flip .status.higher { color: var(--good-text); }
.flip .scores { font-size: 12px; color: var(--ink-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
.previews { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 8px; }
.previews div { font-size: 12px; background: var(--page); border-radius: 6px; padding: 8px; white-space: pre-wrap; }
.previews .ph { color: var(--ink-2); font-weight: 600; display: block; margin-bottom: 4px; }
.empty { color: var(--ink-2); padding: 24px 0; }

/* Runs table: pick A and B */
.pick { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; }
.pick strong { font-weight: 600; }
.pick .ab { display: inline-block; min-width: 18px; text-align: center; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 0 4px; margin-right: 4px; }
.ab.a { background: var(--page); color: var(--ink-2); border: 1px solid var(--axis); }
.ab.b { background: var(--series); color: #ffffff; border: 1px solid var(--series); }
button.swap, .kinds button {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 6px; padding: 2px 8px; cursor: pointer;
}
.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; align-items: center; }
.kinds button[aria-pressed="true"] { background: var(--seq-0); border-color: var(--seq-3); color: var(--seq-ink-0); }
.runs-table { width: 100%; }
.runs-table td.choose { text-align: center; padding: 2px 4px; }
.runs-table td.choose button {
  width: 28px; height: 26px; border-radius: 4px; cursor: pointer; font: 700 11px system-ui, sans-serif;
  border: 1px solid var(--axis); background: transparent; color: var(--muted);
}
.runs-table td.choose button.on.a { background: var(--page); color: var(--ink); border-color: var(--ink-2); }
.runs-table td.choose button.on.b { background: var(--series); color: #ffffff; border-color: var(--series); }
.runs-table tr.is-b th, .runs-table tr.is-b td { background: var(--seq-0); color: var(--seq-ink-0); }
.runs-table tr.is-a th, .runs-table tr.is-a td { background: var(--page); }
.runs-table .kind { color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.runs-table .run-name { font-weight: 500; }
.runs-table .run-date { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.ci-cell { min-width: 220px; }
.ci { display: flex; align-items: center; gap: 8px; }
.ci .txt { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 92px; }
.ci .txt small { color: var(--muted); }
.ci svg { flex: 1; min-width: 100px; height: 14px; }
.ci-scale { margin-left: 100px; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-weight: 400; }

/* Question grid: header row and question column stay in view while scrolling */
.freeze { max-height: 75vh; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
.freeze thead th { position: sticky; top: 0; z-index: 3; background: var(--surface); box-shadow: 0 1px 0 var(--axis); }
.freeze tbody th.q, .freeze tbody th[scope="row"] { position: sticky; left: 0; z-index: 2; background: var(--surface); }
.freeze thead th:first-child { left: 0; z-index: 4; }
.freeze .group-row th { background: var(--surface); }
.freeze .group-row th span { position: sticky; left: 8px; }
.freeze .matrix th.run { max-width: 120px; overflow-wrap: anywhere; white-space: normal; }
.matrix th.run.col-a { box-shadow: inset 0 -3px 0 var(--ink-2), 0 1px 0 var(--axis); }
.matrix th.run.col-b { box-shadow: inset 0 -3px 0 var(--series), 0 1px 0 var(--axis); color: var(--ink); font-weight: 600; }
.matrix th.run .ab { margin: 0 0 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Eval runs</h1>
    <p class="sub" id="subtitle"></p>
  </header>
  <div class="filters" id="filters">
    <label>Question set <select id="set-select"></select></label>
    <div class="pick" id="pick" aria-live="polite"></div>
  </div>
  <main id="main"></main>
</div>
<div class="tooltip" id="tooltip" role="status" hidden></div>

<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);

const METRIC_LABELS = {
  pass_rate: "Pass rate",
  // scoring v2 (eval/scoring.py)
  vital_recall: "Vital facts in answer",
  vital_recall_lenient: "Vital facts (partial = ½)",
  all_recall: "All facts in answer",
  grounded_vital_recall: "Grounded vital facts",
  context_utilization: "Retrieved facts used",
  evidence_recall_initial: "Evidence in 1st retrieval",
  evidence_recall_context: "Evidence in context",
  unsupported_claim: "Answers with unsupported claim",
  grade_documents_correct: "Sufficiency grader right",
  evidence_position: "Evidence position in context",
  warning_shown: "Answers with a warning",
  // retrieval-only runs: evidence ranked 20 deep per collection
  reciprocal_rank: "MRR (evidence rank)",
  evidence_recall_at_1: "Evidence in top 1",
  evidence_recall_at_3: "Evidence in top 3",
  evidence_recall_at_5: "Evidence in top 5",
  evidence_recall_at_10: "Evidence in top 10",
  evidence_recall_at_20: "Evidence in top 20",
  evidence_recall_budget: "Evidence within text budget",
  // scoring v1
  faithfulness: "Faithfulness",
  answer_relevance: "Answer relevance",
  context_precision: "Context precision",
  context_recall: "Context recall",
};
// For these a rise is bad news, so deltas are coloured the other way round.
const LOWER_IS_BETTER = new Set(["unsupported_claim", "warning_shown", "evidence_position"]);
// Why a question failed (eval/scoring.py error types), in reading order.
const ERROR_LABELS = {
  retrieval_miss: "retrieval: evidence not found",
  generator_miss: "generation: vital fact missing",
  unsupported_claim: "generation: unsupported claim",
  wrong_refusal: "refused although evidence was there",
  missed_refusal: "answered a question it should refuse",
  judge_error: "not judged",
  ok: "passed",
};
const DIMENSIONS = { topics: "Topic", language: "Language", source: "Source" };
const MAX_COLUMNS = 16;

// a: the run compared from, b: the run looked at. kinds: which kinds of run are shown.
const KINDS = {
  "answers": "New answers",
  "rescore": "Rescores (other judge)",
  "regrade": "Regrades",
  "grader check": "Grader checks",
  "retrieval only": "Retrieval only",
};
const DEFAULT_KINDS = ["answers", "rescore", "retrieval only"];
const state = { setId: null, a: null, b: null, kinds: new Set(DEFAULT_KINDS), dimension: "topics" };

// ---------- small DOM helpers (text only via textContent) ----------
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value == null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function svgEl(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
  return node;
}
const pct = (v) => (v == null ? "—" : `${Math.round(v * 100)}%`);
const score = (v) => (v == null ? "—" : v.toFixed(2));
function signed(v, asPct) {
  if (v == null) return "—";
  const shown = asPct ? Math.round(v * 100) : Math.round(v * 100) / 100;
  if (shown === 0) return asPct ? "±0 pp" : "±0.00";
  const sign = shown > 0 ? "+" : "−";
  return asPct ? `${sign}${Math.abs(shown)} pp` : `${sign}${Math.abs(shown).toFixed(2)}`;
}
function deltaEl(v, asPct, lowerIsBetter = false) {
  const flat = v == null || Math.abs(v) < 0.005;
  const arrow = flat ? "" : v > 0 ? "▲ " : "▼ ";
  const good = !flat && (v > 0) !== lowerIsBetter;
  const cls = flat ? "flat" : good ? "up" : "down";
  return el("span", { class: `delta ${cls}` }, arrow + signed(v, asPct));
}
function runDate(run, withTime = true) {
  if (!run.timestamp) return run.run_id;
  const d = new Date(run.timestamp);
  const opts = withTime
    ? { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }
    : { day: "numeric", month: "short" };
  return d.toLocaleString(undefined, opts);
}
// Sign test over flipped questions (computed in Python). With few flips
// nothing is significant, which is the point: single flips are hints.
// Retrieval-only runs (basis "evidence rank") count questions whose evidence
// moved up or down instead of pass/fail flips.
function significanceText(sig, basis) {
  const byRank = basis === "evidence rank";
  if (!sig || sig.flipped === 0) {
    return byRank ? "No question's evidence moved." : "No question changed between pass and fail.";
  }
  const p = sig.p_value < 0.001 ? "< 0.001" : `= ${sig.p_value.toFixed(2)}`;
  const n = `${sig.flipped} ${byRank ? "moved" : "flipped"} question${sig.flipped === 1 ? "" : "s"}`;
  return sig.significant
    ? `Unlikely to be chance (sign test, p ${p}, ${n}).`
    : `Could be chance (sign test, p ${p}, ${n}). Treat single flips as hints.`;
}
const runName = (run) => (run.label ? `${run.label} · ${runDate(run)}` : runDate(run));
const intervalText = (run) => (run.pass_rate_interval
  ? `${pct(run.pass_rate_interval[0])}–${pct(run.pass_rate_interval[1])}` : null);
// "44/53 · 83 %" reads faster than the rate alone and shows how few questions it is.
function passCount(run) {
  const judged = Object.values(run.results).filter((r) => r.pass != null);
  return judged.length ? `${judged.filter((r) => r.pass).length}/${judged.length}` : null;
}
const shortLabel = (run) => run.label || runDate(run, false);
const summaryValue = (run, metric) =>
  metric === "pass_rate" ? run.summary.pass_rate : run.summary[`${metric}_mean`];
// Metrics the latest run of a set reports (v1 and v2 runs use different ones).
function shownMetrics(runs) {
  const latest = runs[runs.length - 1];
  const order = Object.keys(METRIC_LABELS);
  const rank = (m) => (order.includes(m) ? order.indexOf(m) : order.length);
  const shown = DATA.metrics.filter((m) => summaryValue(latest, m) != null);
  return ["pass_rate", ...shown.sort((a, b) => rank(a) - rank(b))];
}

// ---------- shared tooltip ----------
const tooltip = document.getElementById("tooltip");
function showTooltip(anchor, build) {
  tooltip.replaceChildren(...build());
  tooltip.hidden = false;
  const r = anchor.getBoundingClientRect();
  const t = tooltip.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));
  let top = r.top - t.height - 8;
  if (top < 8) top = r.bottom + 8;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}
function showTooltipAt(x, y, build) {
  tooltip.replaceChildren(...build());
  tooltip.hidden = false;

// ---------- chart geometry ----------
// Follows the metric-chart rules of DemBot's design system (DemAI-tech/dembot,
// docs/DESIGNS.md "Metric charts"): round value ticks, a tick mark wherever a
// label names a position, labels dropped rather than squeezed, solid grid
// (dashes mean an annotation), numbered marker badges, HTML labels, a plot
// measured to its rendered width, and no empty axes for a series with no data.
// The x axis is run order rather than time: runs come in bursts (four in an
// afternoon, then nothing for days), and a time axis would stack a burst on
// one pixel.
const PLOT_H = 120, PAD = { top: 10, right: 12, bottom: 8, left: 8 };
const TICK_LENGTH = 5;
const CHAR_WIDTH_PX = 6, LABEL_GAP_PX = 10;  // 11px labels; estimates err toward a tick too few
const BADGE_MIN_GAP_PX = 18;

// 1, 2, 2.5 or 5 times a power of ten at or above raw: the steps people count in.
function niceStep(raw) {
  const magnitude = 10 ** Math.floor(Math.log10(raw));
  const f = raw / magnitude;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * magnitude;
}
// Zero-based ticks at a round step; the scale's top is the data's max raised
// to a whole step, so a 0.46 peak reads against 0 / 0.1 / … / 0.5, not against
// fractions of 0.46. Rates stay within 0–1 since every step divides 1.
function niceValueTicks(dataMax, targetCount = 5) {
  if (!(dataMax > 0)) return { max: 1, step: 0.2, ticks: [0, 0.2, 0.4, 0.6, 0.8, 1] };
  const step = niceStep(dataMax / targetCount);
  const count = Math.ceil(dataMax / step - 1e-9);
  const ticks = Array.from({ length: count + 1 }, (_, i) => Math.round(i * step * 1e6) / 1e6);
  return { max: ticks[ticks.length - 1], step, ticks };
}
// Decimals that show a step exactly (0.25 → 2, 0.2 → 1, 1 → 0).
function stepDecimals(step) {
  for (let d = 0; d <= 4; d++) {
    const scaled = step * 10 ** d;
    if (Math.abs(scaled - Math.round(scaled)) < 1e-6) return d;
  }
  return 4;
}
const labelWidth = (label) => label.length * CHAR_WIDTH_PX;
// Keep the run labels that fit between the kept ones and the two flush end
// labels; a label that does not fit is dropped, never overlapped.
function ticksThatFit(candidates, leftClearance, rightClearance) {
  const kept = [];
  let cursor = leftClearance;
  for (const tick of candidates) {
    const half = labelWidth(tick.label) / 2;
    if (tick.x - half < cursor || tick.x + half > rightClearance) continue;
    kept.push(tick);
    cursor = tick.x + half + LABEL_GAP_PX;
  }
  return kept;
}
// Markers closer than a badge's width share one badge naming the range (1–3):
// separate badges would hide all but the top one.
function mergeBadges(markers) {
  const groups = [];
  for (const m of markers) {
    const last = groups[groups.length - 1];
    if (last && m.x - last.x < BADGE_MIN_GAP_PX) last.numbers.push(m.number);
    else groups.push({ x: m.x, numbers: [m.number] });
  }
  return groups;
}

let trendsResize = null;

function drawPanels(panels, runs, set) {
  const hovers = [];
  const setHover = (index) => hovers.forEach((fn) => fn(index));
  const baseIndex = runs.findIndex((r) => r.run_id === set.baseline_run_id);
  const selectedIndex = runs.findIndex((r) => r.run_id === state.b);
  const markers = set.markers
    .map((m, i) => ({ number: i + 1, index: runs.findIndex((r) => r.run_id === m.run_id), reasons: m.reasons }))
    .filter((m) => m.index >= 0);

  for (const { metric, panel } of panels) {
    const values = runs.map((r) => summaryValue(r, metric));
    const latest = values[values.length - 1];
    const asPct = metric === "pass_rate";
    const fmt = (v) => (asPct ? pct(v) : score(v));
    panel.replaceChildren(
      el("h3", {}, METRIC_LABELS[metric] || metric, " ", el("span", { class: "latest" }, fmt(latest))));
    if (values.every((v) => v == null)) {
      panel.append(el("p", { class: "chart-empty", style: `height:${PLOT_H}px` }, "No run on this set reports it."));
      continue;
    }
    const gutter = el("div", { class: "y-gutter", "aria-hidden": "true" });
    const plot = el("div", { class: "plot", tabindex: "0", role: "img",
      "aria-label": `${METRIC_LABELS[metric] || metric} over ${runs.length} runs; latest ${fmt(latest)}. Table below.` });
    const chart = el("div", { class: "chart" }, gutter, plot);
    const xAxis = el("div", { class: "x-axis", "aria-hidden": "true" });
    panel.append(chart, xAxis);

    // Measured, not scaled: one viewBox unit is one CSS pixel at every width.
    const width = Math.max(120, plot.clientWidth);
    const inner = { l: PAD.left, r: width - PAD.right, t: PAD.top, b: PLOT_H - PAD.bottom };
    const xFor = (i) => runs.length === 1 ? (inner.l + inner.r) / 2 : inner.l + (i / (runs.length - 1)) * (inner.r - inner.l);
    // Pass rate carries its 95 % interval; the scale must reach the top of it.
    const intervals = asPct ? runs.map((r) => r.pass_rate_interval) : runs.map(() => null);
    const { max, step, ticks } = niceValueTicks(Math.max(...values.filter((v) => v != null),
      ...intervals.filter(Boolean).map((iv) => iv[1])));
    const yFor = (v) => inner.b - (v / max) * (inner.b - inner.t);
    const tickLabel = asPct ? (v) => `${Math.round(v * 100)}%` : (v) => v.toFixed(stepDecimals(step));
    const svg = svgEl("svg", { viewBox: `0 0 ${width} ${PLOT_H}`, height: PLOT_H, "aria-hidden": "true" });

    // Run labels: both ends flush to their edge, the runs between centred
    // under their point when there is room, in the same vocabulary.
    // Run labels when both end labels fit side by side, dates otherwise: one
    // vocabulary for the whole axis, never two labels run into each other.
    const fits = (label) => labelWidth(shortLabel(runs[0])) + labelWidth(shortLabel(runs[runs.length - 1]))
      + LABEL_GAP_PX <= inner.r - inner.l;
    const runTick = fits() ? shortLabel : (run) => runDate(run, false);
    const startLabel = runTick(runs[0]);
    const endLabel = runs.length > 1 ? runTick(runs[runs.length - 1]) : "";
    const xTicks = runs.length > 2
      ? ticksThatFit(
          // A label already on the axis (three runs on one day) places nothing new.
          runs.slice(1, -1).map((run, k) => ({ x: xFor(k + 1), label: runTick(run) }))
            .filter((t, k, all) => t.label !== startLabel && t.label !== endLabel
              && (k === 0 || t.label !== all[k - 1].label)),
          inner.l + labelWidth(startLabel) + LABEL_GAP_PX,
          inner.r - labelWidth(endLabel) - LABEL_GAP_PX)
      : [];

    // Grid: solid, a line at every labelled value and run; the baseline is the axis.
    for (const tick of ticks) {
      const y = yFor(tick);
      if (tick !== 0) {
        svg.append(svgEl("line", { x1: inner.l, x2: inner.r, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }));
      }
      svg.append(svgEl("line", { x1: inner.l - TICK_LENGTH, x2: inner.l, y1: y, y2: y, stroke: "var(--axis)", "stroke-width": 1 }));
      gutter.append(el("span", { style: `top:${(y / PLOT_H) * 100}%` }, tickLabel(tick)));
    }
    for (const t of xTicks) {
      svg.append(svgEl("line", { x1: t.x, x2: t.x, y1: inner.t, y2: inner.b, stroke: "var(--grid)", "stroke-width": 1 }));
    }
    svg.append(svgEl("line", { x1: inner.l, x2: inner.r, y1: inner.b, y2: inner.b, stroke: "var(--axis)", "stroke-width": 1 }));
    const tickXs = [xFor(0), ...xTicks.map((t) => t.x)];
    if (runs.length > 1) tickXs.push(xFor(runs.length - 1));
    for (const x of tickXs) {
      svg.append(svgEl("line", { x1: x, x2: x, y1: inner.b, y2: inner.b + TICK_LENGTH, stroke: "var(--axis)", "stroke-width": 1 }));
    }

    // Annotations: dashed, numbered; the legend under the charts names them.
    for (const m of markers) {
      svg.append(svgEl("line", { x1: xFor(m.index), x2: xFor(m.index), y1: inner.t, y2: inner.b,
        stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "4 3" }));
    }
    const crosshair = svgEl("line", { y1: inner.t, y2: inner.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
    svg.append(crosshair);

    intervals.forEach((iv, i) => {
      if (!iv || values[i] == null) return;
      svg.append(svgEl("line", { x1: xFor(i), x2: xFor(i), y1: yFor(iv[0]), y2: yFor(iv[1]),
        stroke: "var(--series)", "stroke-width": 3, "stroke-linecap": "round", opacity: 0.25 }));
    });
    // A run without this metric breaks the line rather than bridging it.
    const d = values.map((v, i) => (v == null ? null : `${xFor(i).toFixed(1)} ${yFor(v).toFixed(1)}`))
      .map((p, i, all) => (p == null ? "" : `${i === 0 || all[i - 1] == null ? "M" : "L"} ${p}`)).join(" ");
    svg.append(svgEl("path", { d, fill: "none", stroke: "var(--series)", "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round" }));
    values.forEach((v, i) => {
      if (v == null) return;
      svg.append(svgEl("circle", { cx: xFor(i), cy: yFor(v), r: i === selectedIndex ? 5.5 : 4,
        fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 }));
      if (i === baseIndex) {
        svg.append(svgEl("circle", { cx: xFor(i), cy: yFor(v), r: 8, fill: "none", stroke: "var(--series)", "stroke-width": 1.5 }));
      }
    });
    plot.append(svg);

    // Badges are HTML over the plot, so they keep their size.
    for (const group of mergeBadges(markers.map((m) => ({ number: m.number, x: xFor(m.index) })))) {
      const numbers = group.numbers;
      const text = numbers.length > 1 ? `${numbers[0]}–${numbers[numbers.length - 1]}` : String(numbers[0]);
      plot.append(el("span", { class: "badge", style: `left:${(group.x / width) * 100}%`,
        title: numbers.map((n) => `${n}: ${set.markers[n - 1].reasons.join(", ")}`).join("\n") }, text));
    }

    xAxis.append(el("span", { style: "left:0" }, startLabel));
    for (const t of xTicks) xAxis.append(el("span", { class: "mid", style: `left:${(t.x / width) * 100}%` }, t.label));
    if (endLabel) xAxis.append(el("span", { class: "end" }, endLabel));

    hovers.push((index) => {
      if (index == null) { crosshair.setAttribute("visibility", "hidden"); return; }
      crosshair.setAttribute("x1", xFor(index));
      crosshair.setAttribute("x2", xFor(index));
      crosshair.setAttribute("visibility", "visible");
    });

    const indexAt = (clientX) => {
      const rect = svg.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * width;
      if (runs.length === 1) return 0;
      const i = Math.round(((x - inner.l) / (inner.r - inner.l)) * (runs.length - 1));
      return Math.max(0, Math.min(runs.length - 1, i));
    };
    const tipFor = (index) => () => {
      const run = runs[index];
      const rows = panels.map((p) => p.metric).map((m) =>
        el("div", { class: "t-row" }, el("span", { class: "t-key" }),
          el("strong", {}, m === "pass_rate" ? pct(summaryValue(run, m)) : score(summaryValue(run, m))),
          METRIC_LABELS[m] || m, m === "pass_rate" && intervalText(run) ? ` (${intervalText(run)})` : ""));
      const marker = set.markers.find((mk) => mk.run_id === run.run_id);
      return [
        el("div", { class: "t-head" }, runName(run), run.run_id === set.baseline_run_id ? " · baseline" : ""),
        ...rows,
        marker ? el("div", { class: "t-head" }, `⚠ ${marker.reasons.join(", ")}`) : null,
      ].filter(Boolean);
    };
    plot.addEventListener("pointermove", (e) => {
      const index = indexAt(e.clientX);
      setHover(index);
      showTooltipAt(e.clientX, e.clientY, tipFor(index));
    });
    plot.addEventListener("pointerleave", () => { setHover(null); hideTooltip(); });
    plot.addEventListener("click", (e) => selectRun(runs[indexAt(e.clientX)].run_id));
    let focusIndex = selectedIndex >= 0 ? selectedIndex : runs.length - 1;
    plot.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") focusIndex = Math.max(0, focusIndex - 1);
      else if (e.key === "ArrowRight") focusIndex = Math.min(runs.length - 1, focusIndex + 1);
      else if (e.key === "Enter") { selectRun(runs[focusIndex].run_id); return; }
      else return;
      e.preventDefault();
      setHover(focusIndex);
      showTooltip(plot, tipFor(focusIndex));
    });
    plot.addEventListener("blur", () => { setHover(null); hideTooltip(); });
  }
}

function comparison(set) {
  const cmp = currentPair(set);
  const section = el("section", { class: "card", "aria-labelledby": "h-compare" },
    el("h2", { id: "h-compare" }, "Compare A → B"));
  if (!cmp) {
    section.append(el("p", { class: "empty" },
      "This is the only run on this question set so far; there is nothing to compare it with."));
    return section;
  }
  const base = DATA.runs[cmp.base_run_id], run = DATA.runs[cmp.run_id];
  // Flipped questions come as ids; question text and scores are in the runs.
  const questionText = Object.fromEntries(set.questions.map((q) => [q.id, q.question]));
  const full = (q) => ({ id: q.id, question: questionText[q.id] || q.id,
    before: (base.results[q.id] || {}).metrics || {}, after: (run.results[q.id] || {}).metrics || {} });
  section.append(
    el("p", { class: "pair" }, `A: ${runName(base)}  →  B: ${runName(run)}`,
      cmp.commits[0] || cmp.commits[1] ? `   (${cmp.commits[0] || "?"} → ${cmp.commits[1] || "?"})` : ""),
    el("p", { class: "verdict" }, cmp.verdict),
    cmp.comparable === false
      ? el("p", { class: "note" }, "Pass/fail rules or grading targets differ between these runs, so " +
          "flipped questions say as much about the new rules as about the system. " +
          "Compare with a run scored the same way, or label one as the new baseline.")
      : el("p", { class: "note" }, significanceText(cmp.significance, cmp.basis)));
  if (cmp.warnings.length) {
    section.append(el("ul", { class: "warnings" }, cmp.warnings.map((w) => el("li", {}, w))));
  }

  const order = Object.keys(METRIC_LABELS);
  const rank = (m) => (order.includes(m) ? order.indexOf(m) : order.length);
  const keys = ["pass_rate", ...DATA.metrics
    .filter((m) => summaryValue(base, m) != null || summaryValue(run, m) != null)
    .sort((a, b) => rank(a) - rank(b))];
  section.append(el("h3", {}, "Scores"), el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Metric"), el("th", { class: "num" }, "A"), el("th", { class: "num" }, "B"), el("th", { class: "num" }, "Change"))),
    el("tbody", {}, keys.map((m) => {
      const asPct = m === "pass_rate";
      const fmt = asPct ? pct : score;
      const key = asPct ? m : `${m}_mean`;
      return el("tr", {}, el("th", {}, METRIC_LABELS[m] || m),
        el("td", { class: "num" }, fmt(base.summary[key]), asPct && intervalText(base) ? el("small", { class: "sub" }, ` (${intervalText(base)})`) : null),
        el("td", { class: "num" }, fmt(run.summary[key]), asPct && intervalText(run) ? el("small", { class: "sub" }, ` (${intervalText(run)})`) : null),
        el("td", { class: "num" }, deltaEl(cmp.summary_delta[key], asPct, LOWER_IS_BETTER.has(m))));
    })))));

  section.append(el("h3", {}, "Settings"));
  if (cmp.config_diff === null) {
    section.append(el("p", { class: "note" }, "Settings were not recorded for one of these runs, so they cannot be compared."));
  } else if (cmp.config_diff.length === 0) {
    section.append(el("p", { class: "note" }, "Same settings, prompts and models in both runs."));
  } else {
    section.append(el("div", { class: "scroll" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Setting"), el("th", {}, "Before"), el("th", {}, "After"))),
      el("tbody", {}, cmp.config_diff.map((c) =>
        el("tr", {}, el("th", {}, el("code", {}, c.field)), el("td", {}, el("code", {}, JSON.stringify(c.before))), el("td", {}, el("code", {}, JSON.stringify(c.after)))))))));
  }

  const flipList = (title, items, status) =>
    items.length
      ? [el("h3", {}, `${title} (${items.length})`), ...items.map((q) => flipCard(full(q), status, base, run))]
      : [];
  const byRank = cmp.basis === "evidence rank";
  const flips = [
    ...flipList(byRank ? "Evidence ranked lower in B" : "Regressions: passed in A, fail in B", cmp.regressions, byRank ? "lower" : "fail"),
    ...flipList(byRank ? "Evidence ranked higher in B" : "Improvements: failed in A, pass in B", cmp.improvements, byRank ? "higher" : "pass"),
  ];
  if (cmp.comparable === false && flips.length) {
    section.append(el("details", {},
      el("summary", {}, `Pass/fail changes under different rules, for reference only (${cmp.regressions.length + cmp.improvements.length})`),
      flips));
  } else {
    section.append(...flips);
  }
  // Score shifts without a pass/fail flip: collapsed, since with continuous
  // scores nearly every question moves a little.
  if (cmp.changed.length) {
    section.append(el("details", {},
      el("summary", {}, `Other score changes, no pass/fail flip (${cmp.changed.length})`),
      cmp.changed.map((q) => flipCard(full(q), null, base, run))));
  }
  if (cmp.unjudged && cmp.unjudged.length) {
    section.append(el("p", { class: "note" },
      `${cmp.unjudged.length} question${cmp.unjudged.length === 1 ? " was" : "s were"} not judged in one of the runs and ` +
      `${cmp.unjudged.length === 1 ? "is" : "are"} left out of this comparison: ${cmp.unjudged.join(", ")}.`));
  }
  if (!cmp.regressions.length && !cmp.improvements.length && !cmp.changed.length) {
    section.append(el("p", { class: "note" }, "Every question scored exactly the same in both runs."));
  }
  return section;
}

// "lower"/"higher": retrieval-only comparisons, where evidence moves in rank.
const STATUS_TEXT = { fail: "✗ fails", pass: "✓ passes", lower: "↓ lower", higher: "↑ higher" };
function flipCard(q, status, base, run) {
  const scores = DATA.metrics
    .filter((m) => q.before[m] != null || q.after[m] != null)
    .map((m) => `${METRIC_LABELS[m] || m} ${score(q.before[m])} → ${score(q.after[m])}`).join("  ·  ");
  const before = base.results[q.id] || {}, after = run.results[q.id] || {};
  const why = after.error_type && after.error_type !== "ok" ? ERROR_LABELS[after.error_type] || after.error_type : null;
  const previews = before.preview || after.preview
    ? el("details", {}, el("summary", {}, "Answers"),
        el("div", { class: "previews" },
          el("div", {}, el("span", { class: "ph" }, "A"), before.preview || "Not available (report not on this machine)."),
          el("div", {}, el("span", { class: "ph" }, "B"), after.preview || "Not available (report not on this machine).")))
    : null;
  return el("div", { class: "flip" },
    el("div", {},
      status ? el("span", { class: `status ${status}` }, STATUS_TEXT[status]) : null,
      q.question || q.id),
    why ? el("div", { class: "scores" }, `Now: ${why}`) : null,
    el("div", { class: "scores" }, scores),
    previews);
}

// Pass/fail per question: retrieval-only runs answer nothing, so they stay out.
function visibleRuns(set) {
  const answered = setRuns(set).filter((r) => r.kind !== "retrieval only");
  // the latest runs, and A and B even when they are older
  return answered.filter((r, k) => k >= answered.length - MAX_COLUMNS || r.run_id === state.a || r.run_id === state.b);
}
function runHeader(run) {
  const which = run.run_id === state.b ? "b" : run.run_id === state.a ? "a" : null;
  return el("th", { class: `run${which ? ` col-${which}` : ""}`, scope: "col", title: runName(run) },
    which ? [el("span", { class: `ab ${which}` }, which.toUpperCase()), el("br")] : null,
    shortLabel(run), el("br"), run.label ? runDate(run, false) : "",
    run.judge ? [el("br"), run.judge.split("-")[0]] : "");
}
function truncatedNote(set) {
  const answered = setRuns(set).filter((r) => r.kind !== "retrieval only").length;
  return answered > visibleRuns(set).length
    ? el("p", { class: "note" }, `Showing the latest ${MAX_COLUMNS} of ${answered} runs, and A and B.`)
    : null;
}

function topicTable(set) {
  const runs = visibleRuns(set);
  const dim = state.dimension;
  const tags = [...new Set(runs.flatMap((r) => Object.keys(set.breakdown[r.run_id][dim])))].sort();
  const dimSelect = el("select", { "aria-label": "Break down by" },
    Object.entries(DIMENSIONS).map(([key, name]) => el("option", { value: key, selected: key === dim }, name)));
  dimSelect.addEventListener("change", (e) => { state.dimension = e.target.value; render(); });

  const section = el("section", { class: "card", "aria-labelledby": "h-topics" },
    el("h2", { id: "h-topics" }, "By topic"),
    el("p", { class: "note" },
      "Pass rate per group; darker is higher. Greyed cells have fewer than 3 questions, so one question flipping swings them completely."),
    el("label", {}, "Break down by ", dimSelect),
    truncatedNote(set));
  const table = el("table", { class: "matrix" },
    el("thead", {}, el("tr", {}, el("th", { scope: "col" }, DIMENSIONS[dim]), runs.map(runHeader))),
    el("tbody", {}, tags.map((tag) => el("tr", {},
      el("th", { scope: "row" }, tag),
      runs.map((run) => {
        const g = set.breakdown[run.run_id][dim][tag];
        if (!g) return el("td", { class: "cell" }, el("span", { class: "cell-btn missing" }, "—"));
        if (g.pass_rate == null) {
          return el("td", { class: "cell" }, el("span", { class: "cell-btn missing" }, "not judged"));
        }
        const step = Math.round(g.pass_rate * 5);
        const btn = el("button", {
          type: "button",
          class: `cell-btn${g.low_n ? " low-n" : ""}`,
          style: `background:var(--seq-${step});color:var(--seq-ink-${step})`,
          "aria-label": `${tag}, ${runName(run)}: pass rate ${pct(g.pass_rate)} of ${g.n} question${g.n === 1 ? "" : "s"}`,
        }, pct(g.pass_rate), el("span", { class: "n" }, `n=${g.n}`));
        const tip = () => [
          el("div", { class: "t-head" }, `${tag} · ${runName(run)}`),
          el("div", { class: "t-row" }, el("strong", {}, pct(g.pass_rate)), `pass rate, ${g.n} question${g.n === 1 ? "" : "s"}`),
          ...Object.entries(g.means).map(([m, v]) => el("div", { class: "t-row" }, el("strong", {}, score(v)), METRIC_LABELS[m] || m)),
        ];
        btn.addEventListener("pointerenter", () => showTooltip(btn, tip));
        btn.addEventListener("focus", () => showTooltip(btn, tip));
        btn.addEventListener("pointerleave", hideTooltip);
        btn.addEventListener("blur", hideTooltip);
        btn.addEventListener("click", () => selectRun(run.run_id));
        return el("td", { class: "cell" }, btn);
      })))));
  section.append(el("div", { class: "freeze" }, table));
  return section;
}

// passed / failed (with the reason, for runs scored with v2) / not judged
function outcome(r) {
  if (r.pass == null) return "not judged";
  if (r.pass) return "passed";
  return r.error_type ? `failed: ${ERROR_LABELS[r.error_type] || r.error_type}` : "failed";
}

function questionGrid(set) {
  const runs = visibleRuns(set);
  const groups = new Map();
  for (const q of set.questions) {
    const key = (q.topics && q.topics[0]) || "untagged";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(q);
  }
  const section = el("section", { class: "card", "aria-labelledby": "h-grid" },
    el("h2", { id: "h-grid" }, "Questions"),
    el("p", { class: "note" }, "✓ passed, ✗ failed, ? not judged. Hover or focus a cell for its scores and why it failed; click to make that run B. The header row and the questions stay in view while you scroll."),
    truncatedNote(set));
  const body = el("tbody");
  for (const [group, questions] of [...groups.entries()].sort()) {
    body.append(el("tr", { class: "group-row" }, el("th", { colspan: runs.length + 1, scope: "rowgroup" }, el("span", {}, group))));
    for (const q of questions) {
      body.append(el("tr", {},
        el("th", { class: "q", scope: "row" },
          q.question, el("span", { class: "qid" }, q.id,
            [q.language, q.source].filter(Boolean).length ? ` · ${[q.language, q.source].filter(Boolean).join(" · ")}` : ""),
          (q.topics || []).slice(1).map((t) => el("span", { class: "topic-tag" }, t))),
        runs.map((run) => {
          const r = run.results[q.id];
          if (!r) return el("td", { class: "cell" }, el("span", { class: "cell-btn missing" }, "—"));
          const btn = el("button", {
            type: "button",
            class: `cell-btn ${r.pass == null ? "unjudged" : r.pass ? "pass" : "fail"}`,
            "aria-label": `${q.id}, ${runName(run)}: ${outcome(r)}`,
          }, r.pass == null ? "?" : r.pass ? "✓" : "✗");
          const tip = () => [
            el("div", { class: "t-head" }, `${runName(run)} · ${outcome(r)}`),
            ...Object.entries(r.metrics).map(([m, v]) => el("div", { class: "t-row" }, el("strong", {}, score(v)), METRIC_LABELS[m] || m)),
            r.retrieval_warning ? el("div", { class: "t-head" }, "⚠ answer not fully verified against trusted sources") : null,
            r.web_search_attempted ? el("div", { class: "t-head" }, "used web search") : null,
          ].filter(Boolean);
          btn.addEventListener("pointerenter", () => showTooltip(btn, tip));
          btn.addEventListener("focus", () => showTooltip(btn, tip));
          btn.addEventListener("pointerleave", hideTooltip);
          btn.addEventListener("blur", hideTooltip);
          btn.addEventListener("click", () => selectRun(run.run_id));
          return el("td", { class: "cell" }, btn);
        })));
    }
  }
  section.append(el("div", { class: "freeze" }, el("table", { class: "matrix" },
    el("thead", {}, el("tr", {}, el("th", { scope: "col" }, "Question"), runs.map(runHeader))),
    body)));
  return section;
}

// ---------- render ----------
function render() {
  hideTooltip();
  const main = document.getElementById("main");
  const set = currentSet();
  if (!set) return;
  const shown = setRuns(set);
  const pool = shown.length ? shown : allSetRuns(set);
  if (!state.b || !set.run_ids.includes(state.b)) {
    // newest run with new answers: a rescore of old answers is rarely what one opens the page for
    const answers = pool.filter((r) => r.kind === "answers");
    const candidates = answers.length ? answers : pool;
    state.b = candidates[candidates.length - 1].run_id;
    state.a = set.compare_with[state.b];
  }
  if (state.a && !set.run_ids.includes(state.a)) state.a = set.compare_with[state.b];
  syncPick();
  document.getElementById("set-select").value = state.setId;
  main.replaceChildren(headline(set), runsTable(set), comparison(set), trends(set), topicTable(set), questionGrid(set));
}

const runCount = Object.keys(DATA.runs).length;
document.getElementById("subtitle").textContent =
  `${runCount} recorded run${runCount === 1 ? "" : "s"} across ${DATA.sets.length} question set${DATA.sets.length === 1 ? "" : "s"}.`;
if (!DATA.sets.length) {
  document.getElementById("filters").hidden = true;
  document.getElementById("main").append(el("div", { class: "card" },
    el("p", { class: "empty" }, "No runs recorded yet. Run an evaluation to start the history: "),
    el("code", {}, "uv run python -m eval.run_eval --label baseline")));
} else {
  state.setId = DATA.sets[0].questions_hash;
  initFilters();
  render();
  // Charts are drawn at their measured width, so redraw when the width
  // changes; height-only resizes (a phone's address bar) keep the page as is.
  let resizeTimer, lastWidth = window.innerWidth;
  window.addEventListener("resize", () => {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });
}
</script>
</body>
</html>
