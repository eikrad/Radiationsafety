name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Backend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run pre-commit run --all-files
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run isort --check .
      - run: uv run mypy api/main.py api/rate_limit.py tests/test_api.py --follow-imports=skip
      - run: uv run pytest tests/ -n auto -v --cov
      - name: Backend coverage summary
        if: success() || failure()
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" \
            || echo "No coverage data (tests did not run)." >> "$GITHUB_STEP_SUMMARY"

      # Frontend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Frontend unit tests with coverage
        working-directory: frontend
        shell: bash
        run: |
          npm run test:coverage | tee coverage.txt
          {
            echo "## Frontend coverage (unit tests; e2e not measured)"
            echo '```'
            sed -n '/Coverage summary/,/^=*$/p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Playwright E2E (UI-only, mocked API)
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e

  docker-integration:
    # Runs on every push/PR: frontend code, package.json or a type error can
    # break the image build just as well as a Dockerfile change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build

      - name: Create CI env file
        run: |
          # docker-compose.yml requires `env_file: .env` to exist for `docker compose up` to
          # even start — it doesn't need to contain real secrets since the backend only
          # loads LLM API keys lazily per-request (graph/llm_factory.py), never at startup,
          # so /health responds before any provider key is touched. A placeholder is enough.
          cp .env.example .env
          echo "GOOGLE_API_KEY=ci-test-key-not-real" >> .env

      - name: Start the stack and wait until it answers
        timeout-minutes: 3
        run: |
          docker compose up -d
          # The frontend starts only once the backend is healthy (depends_on).
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8000/health \
              && curl -fsS -o /dev/null http://localhost:8080/ \
              && curl -fsS -o /dev/null http://localhost:8080/api/health; then
              echo "✅ Backend, frontend and the nginx /api proxy answer"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Stack did not come up"
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down
