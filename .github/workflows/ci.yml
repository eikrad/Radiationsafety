name: CI
on:
  # Branches get CI through their pull request; pushes only for the long-lived ones.
  push:
    branches: [master, staging]
  pull_request:

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs are independent and run in parallel; `test` gathers them for the
# required status check on staging.
jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pre-commit run --all-files
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run isort --check .
      - run: uv run mypy api/main.py api/rate_limit.py tests/test_api.py --follow-imports=skip

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/ -n auto -v --cov
      - name: Backend coverage summary
        if: success() || failure()
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" \
            || echo "No coverage data (tests did not run)." >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit tests with coverage
        shell: bash
        run: |
          npm run test:coverage | tee coverage.txt
          {
            echo "## Frontend coverage (unit tests; e2e not measured)"
            echo '```'
            sed -n '/Coverage summary/,/^=*$/p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (UI-only, mocked API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  visual:
    name: visual (screenshot comparison)
    runs-on: ubuntu-latest
    # Same image as `npm run test:visual:docker`, so baselines match pixel for pixel.
    # Keep the tag in step with @playwright/test in frontend/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:visual
        env:
          HOME: /root
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: frontend/test-results/
          retention-days: 7

  docker-integration:
    # Runs on every push/PR: frontend code, package.json or a type error can
    # break the image build just as well as a Dockerfile change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build

      - name: Create CI env file
        run: |
          # docker-compose.yml requires `env_file: .env` to exist for `docker compose up` to
          # even start — it doesn't need to contain real secrets since the backend only
          # loads LLM API keys lazily per-request (graph/llm_factory.py), never at startup,
          # so /health responds before any provider key is touched. A placeholder is enough.
          cp .env.example .env
          echo "GOOGLE_API_KEY=ci-test-key-not-real" >> .env

      - name: Start the stack and wait until it answers
        timeout-minutes: 3
        run: |
          docker compose up -d
          # The frontend starts only once the backend is healthy (depends_on).
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8000/health \
              && curl -fsS -o /dev/null http://localhost:8080/ \
              && curl -fsS -o /dev/null http://localhost:8080/api/health; then
              echo "✅ Backend, frontend and the nginx /api proxy answer"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Stack did not come up"
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down

  test:
    # The required status check on staging: passes only if every job above passed.
    if: always()
    needs: [backend-lint, backend-tests, frontend, e2e, visual, docker-integration]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "❌ At least one CI job did not pass"
            exit 1
          fi
