server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api to backend (strip /api prefix so backend receives /query, /health, etc.)
    location /api/ {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A query runs several LLM calls in sequence (grading, generation, retries,
        # web search); each gives up after LLM_REQUEST_TIMEOUT_SEC. nginx's default
        # of 60 s cut off answers the backend was still producing.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
